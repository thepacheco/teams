<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-head">
        <h1>Archive</h1>
        <div id="global-search-wrap">
          <input id="global-search" type="text" placeholder="Search every message…" autocomplete="off">
          <button id="global-search-clear" title="Clear search">&times;</button>
        </div>
      </div>

      <div id="nav-tabs">
        <button class="nav-tab active" data-tab="chats">Chats</button>
        <button class="nav-tab" data-tab="photos">Photos</button>
      </div>

      <div id="conv-list-wrap">
        <ul id="conv-list"></ul>
      </div>
      <div id="sidebar-foot">
        <span id="export-meta"></span>
      </div>
    </aside>

    <main id="main">
      <div id="results-view" class="view">
        <div id="results-head">
          <button id="results-back" class="mobile-back" aria-label="Back to conversations">&larr; Chats</button>
          <span id="results-count"></span>
        </div>
        <ul id="results-list"></ul>
      </div>

      <div id="thread-view" class="view">
        <header id="thread-head">
          <div id="thread-head-top">
            <button id="thread-back" class="mobile-back" aria-label="Back to conversations">&larr; Chats</button>
            <div class="avatar" id="thread-avatar"></div>
            <div id="thread-titles">
              <div id="thread-title"></div>
              <div id="thread-meta"></div>
            </div>
          </div>
          <div id="thread-toolbar">
            <div id="timeline-controls">
              <button id="jump-oldest" class="timeline-btn" title="Jump to first message">Oldest</button>
              <div class="date-input-wrap">
                <input id="date-jump" type="date" title="Jump to date" aria-label="Jump to specific date">
              </div>
              <select id="month-jump" aria-label="Jump to month">
                <option value="">Month&hellip;</option>
              </select>
              <button id="jump-newest" class="timeline-btn" title="Jump to latest message">Latest</button>
            </div>
            <div id="thread-search-wrap">
              <input id="thread-search" type="text" placeholder="Search in this thread…" autocomplete="off">
            </div>
          </div>
        </header>
        <div id="thread-scroll">
          <button id="load-older" type="button">Load earlier messages</button>
          <div id="thread-messages"></div>
        </div>
      </div>

      <div id="photos-view" class="view">
        <header id="photos-head">
          <div id="photos-head-top">
            <button id="photos-back" class="mobile-back" aria-label="Back to conversations">&larr; Chats</button>
            <div id="photos-title">Photos &amp; Media</div>
          </div>
          <div id="photos-meta">All media files from <code>data/media/</code></div>
        </header>
        <div id="photos-grid-wrap">
          <div id="photos-grid"></div>
          <div id="photos-empty" class="hidden">No files in <code>data/media/</code> yet.</div>
        </div>
      </div>

      <div id="empty-view" class="view">
        <div id="empty-inner">
          <p>Pick a thread on the left, or search across everything.</p>
        </div>
      </div>
    </main>
  </div>

  <div id="lightbox">
    <button id="lightbox-close" aria-label="Close">&times;</button>
    <button id="lightbox-prev" aria-label="Previous">&#8249;</button>
    <div id="lightbox-content"></div>
    <button id="lightbox-next" aria-label="Next">&#8250;</button>
    <div id="lightbox-caption"></div>
  </div>

<script src="app.js"></script>
</body>
</html>
